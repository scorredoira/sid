# sid's defaults: the editor as it should be the moment it is installed.
# The user's config.toml is laid over this, so any of it can still be changed.
# No arrays here: the merge would append the user's items to them, not replace.

theme = { light = "github_light", dark = "github_dark" }

[editor]
# The editor opens where you type, and stays there: normal mode is still all here, but
# nothing takes you to it without asking.
default-mode = "insert"
# Opening the editor on a project opens the files it had open.
restore-session = true
bufferline = "always"
color-modes = true

[editor.file-picker]
git-ignore = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true

[editor.word-completion]
enable = false

# The keys of every mode go under [keys.all]: they are laid under normal, select and
# insert, and a mode's own table wins over them.
[keys.all]
# F1 is every command, searchable, with its keys: reachable in any terminal, even one that
# sends no Cmd and no Ctrl-Shift with a letter.
F1 = "command_palette"
S-F1 = "keyboard_shortcuts"
F4 = "review_context_toggle"
F6 = "review_commits_toggle"
F7 = "review_code_toggle"
F9 = "review_files_toggle"
"C-," = "settings"
# Back and forth through where you have been: Alt on its own never reaches a Mac terminal,
# so this is the pair that does.
"C-A-left" = "jump_backward"
"C-A-right" = "jump_forward"
F2 = "rename_symbol"
F8 = "goto_next_diag"
F12 = "goto_definition"
S-F12 = "goto_reference"
C-z = "undo"
C-y = "redo"
C-Z = "redo"
C-x = "cut_to_clipboard"
# Cut took Ctrl-X, which was how completion was asked for by hand.
C-space = "completion"
C-c = "copy_to_clipboard"
C-v = "paste_from_clipboard"
C-d = "select_next_occurrence"
C-L = "select_all_occurrences"
C-D = "duplicate_line"
C-K = "delete_line"
C-up = "move_lines_up"
C-down = "move_lines_down"
C-S-up = "expand_selection"
C-S-down = "shrink_selection"
C-p = "file_picker"
C-P = "command_palette"
# The typed command line, whatever the mode: how a tool that drives the editor, like
# the link handler behind a click in the terminal, reaches it now that ":" is text.
F10 = "command_mode"
C-F = "global_search"
C-b = "sidebar_toggle"
C-E = "sidebar_focus"
C-R = "sidebar_reveal"
# The file tree's own three, on keys of their own so they work wherever the focus is and
# shadow nothing: what they act on is the row the tree has selected, or the file being
# edited when no tree is on screen.
"C-A-n" = "explorer_new"
"C-A-r" = "explorer_rename"
S-del = "explorer_delete"
# The same without Shift, for the terminals where Ctrl-Shift-letter arrives as Ctrl-letter.
C-e = "sidebar_focus"
C-r = "sidebar_reveal"
C-o = "lsp_or_syntax_symbol_picker"
C-l = "select_all_occurrences"
# Function keys, so they reach the editor wherever the focus is: F3 and F11 are taken,
# by search and by the terminal's full screen.
S-F11 = "sidebar_collapse"
S-F4 = ":buffer-close-all"
# F5 refreshes what the sidebar shows; Shift-F5 brings sid itself up to date.
S-F5 = ":check-updates"
C-O = "lsp_or_syntax_symbol_picker"
C-t = "lsp_or_syntax_workspace_symbol_picker"
C-home = "goto_file_start"
C-end = "goto_last_line"
C-pageup = "goto_previous_buffer"
C-pagedown = "goto_next_buffer"
C-w = ":buffer-close"
C-S = "save_as"
# Comment is Ctrl-/, which on a Spanish keyboard is the 7 key, with or without shift.
C-7 = "toggle_comments"
C-S-7 = "toggle_comments"
# Ctrl-] and Ctrl-\ ask for Alt on that keyboard too: they are the + and º keys.
"C-A-+" = "indent"
"C-A-º" = "vsplit"
C-q = "quit_saving"
C-a = "select_all"
C-s = ":write"
C-n = ":new"
C-g = "goto_line_prompt"
C-f = "search_in_file"
A-z = ":toggle soft-wrap.enable"
# Format the file, as in VS Code; JSON and XML need nothing installed.
A-F = ":format"
# Git from wherever you are: who changed this line, and the file's history.
"C-A-b" = "blame_line"
"C-A-l" = "file_history"
# And a diff side by side, or one side above the other.
"C-A-d" = "review_side_by_side_toggle"
C-B = "markdown_preview_toggle"
C-M = "markdown_preview_full"

# Mac editing shortcuts. Ctrl bindings above remain available on other keyboards.
# Ghostty must release its Cmd bindings so these reach the editor.
"Cmd-," = "settings"
Cmd-z = "undo"
Cmd-Z = "redo"
Cmd-x = "cut_to_clipboard"
Cmd-c = "copy_to_clipboard"
Cmd-v = "paste_from_clipboard"
Cmd-a = "select_all"
Cmd-d = "select_next_occurrence"
Cmd-L = "select_all_occurrences"
Cmd-K = "delete_line"
A-S-down = "duplicate_line"
A-up = "move_lines_up"
A-down = "move_lines_down"
Cmd-C-S-right = "expand_selection"
Cmd-C-S-left = "shrink_selection"
Cmd-p = "file_picker"
Cmd-P = "command_palette"
Cmd-f = "search_in_file"
Cmd-F = "global_search"
Cmd-g = "search_next"
Cmd-G = "search_prev"
Cmd-b = "sidebar_toggle"
Cmd-E = "sidebar_focus"
Cmd-R = "sidebar_reveal"
"Cmd-A-n" = "explorer_new"
"Cmd-A-r" = "explorer_rename"
Cmd-O = "lsp_or_syntax_symbol_picker"
Cmd-t = "lsp_or_syntax_workspace_symbol_picker"
Cmd-up = "goto_file_start"
Cmd-down = "goto_last_line"
Cmd-home = "goto_file_start"
Cmd-end = "goto_last_line"
Cmd-pageup = "goto_previous_buffer"
Cmd-pagedown = "goto_next_buffer"
Cmd-w = ":buffer-close"
Cmd-s = ":write"
Cmd-S = "save_as"
Cmd-n = ":new"
Cmd-o = "file_picker"
Cmd-q = "quit_saving"
"Cmd-/" = "toggle_comments"
Cmd-7 = "toggle_comments"
Cmd-S-7 = "toggle_comments"
"Cmd-]" = "indent"
"Cmd-[" = "unindent"
"Cmd-A-+" = "indent"
"Cmd-\\" = "vsplit"
"Cmd-A-º" = "vsplit"
Cmd-A-left = "jump_backward"
Cmd-A-right = "jump_forward"
Cmd-A-b = "blame_line"
Cmd-A-l = "file_history"
Cmd-V = "markdown_preview_toggle"
Cmd-B = "markdown_preview_toggle"
Cmd-M = "markdown_preview_full"

[keys.normal]
backspace = "delete_selection_or_previous_char"
del = "delete_selection_noyank"

[keys.normal.space]
space = "global_search"

[keys.select]
backspace = "delete_selection_or_previous_char"
del = "delete_selection_noyank"

[keys.insert]
# Escape is what closes things — unless the editor is back to opening in normal mode,
# and then it is the way out of insert again.
esc = "escape"
C-left = "move_prev_word_start"
C-right = "move_next_word_start"
A-left = "move_prev_word_start"
A-right = "move_next_word_start"
# Option and an arrow is what a Mac sends for those, and it sends them the old way: as
# Escape and a letter, which is Alt-b and Alt-f.
A-b = "move_prev_word_start"
A-f = "move_next_word_start"
C-backspace = "delete_word_backward"
C-del = "delete_word_forward"
# The emacs keys, off: they are what a stray control sequence lands on, and what it lands
# on should never be "delete the line up to here".
C-u = "no_op"
C-k = "no_op"
S-left = "extend_char_left"
S-right = "extend_char_right"
S-up = "extend_visual_line_up"
S-down = "extend_visual_line_down"
S-home = "extend_to_line_start"
S-end = "extend_to_line_end"
C-S-left = "extend_prev_word_start"
C-S-right = "extend_next_word_end"
Cmd-left = "goto_line_start"
Cmd-right = "goto_line_end_newline"
Cmd-S-left = "extend_to_line_start"
Cmd-S-right = "extend_to_line_end"
A-S-left = "extend_prev_word_start"
A-S-right = "extend_next_word_end"
A-backspace = "delete_word_backward"
A-del = "delete_word_forward"
